name: Tests

# Per-repo CI for mcpnuke. Gates lint first, then runs the unit-test suite
# verbose against Python 3.11, 3.12 and 3.13 on every push and PR. Includes a one-shot
# policy round-trip lint that confirms `--generate-policy` still emits YAML the
# nullfield v1alpha1 controller can load (catches schema drift early).
#
# Install steps use `uv sync --frozen --extra dev` with uv's cache keyed on the
# committed uv.lock, so CI resolves the same dependency set every run. Both had
# to be switched off while uv.lock was untracked: the cache glob matched no file
# and `--frozen` had no lock to honour, which failed every job before pytest ran.
#
# Cross-repo coherence (transport taxonomy, lab count) lives in
# agentic-sec's `cross-repo-coherence` workflow; we notify it via
# repository_dispatch on a successful main build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --frozen installs from the lock without re-resolving, so a pyproject
      # edit that was never locked would otherwise pass unnoticed.
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install project
        run: uv sync --frozen --extra dev

      # Strict: the tree is clean, so any new finding is a regression.
      - name: Ruff
        run: uv run ruff check .

      # Ratchet rather than strict, because pre-existing errors are being paid
      # down in a dedicated typing pass. The count may fall, never rise;
      # lower MYPY_CEILING as it does. Measured with a cold cache, which is
      # what CI always has — a warm cache under-reports.
      - name: Mypy
        env:
          MYPY_CEILING: '42'
        run: |
          out="$(uv run mypy mcpnuke/ 2>&1 || true)"
          echo "$out" | tail -20
          count="$(printf '%s\n' "$out" | sed -n 's/^Found \([0-9]*\) error.*/\1/p')"
          count="${count:-0}"
          echo "mypy errors: $count (ceiling: $MYPY_CEILING)"
          if [ "$count" -gt "$MYPY_CEILING" ]; then
            echo "::error::mypy regressed: $count errors exceeds ceiling of $MYPY_CEILING"
            exit 1
          fi
          if [ "$count" -lt "$MYPY_CEILING" ]; then
            echo "::notice::mypy improved to $count; lower MYPY_CEILING to lock it in"
          fi

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Covers the full declared range. requires-python is >=3.11, and ruff
        # and mypy both target 3.11, so the floor is tested rather than assumed.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --frozen --extra dev

      - name: Run pytest verbose
        run: uv run pytest -v --tb=short

  policy-yaml-roundtrip:
    name: --generate-policy YAML round-trip
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen --extra dev

      - name: Render and parse a sample policy
        run: |
          uv run python - <<'PY'
          import yaml
          from mcpnuke.core.models import Finding, TargetResult
          from mcpnuke.policy import generate_policy, serialize_policy

          r = TargetResult(url="http://test/mcp")
          r.findings.append(Finding(
              target=r.url, check="code_execution", severity="CRITICAL",
              title="Tool 'risky.exec' has execution param",
          ))
          rules = generate_policy([r])
          out = serialize_policy(
              rules,
              name="ci-roundtrip",
              namespace="camazotz",
              selector_labels={"app": "brain-gateway"},
              metadata_labels={"nullfield.io/lane": "machine"},
          )
          loaded = yaml.safe_load(out)

          assert loaded["apiVersion"] == "nullfield.io/v1alpha1", loaded
          assert loaded["kind"] == "NullfieldPolicy", loaded
          assert loaded["spec"]["selector"]["matchLabels"] == {"app": "brain-gateway"}
          assert loaded["metadata"]["labels"] == {"nullfield.io/lane": "machine"}
          print("OK — generated policy parses back into the v1alpha1 shape")
          PY

  notify-coherence:
    name: Notify ecosystem coherence workflow
    runs-on: ubuntu-latest
    needs: [pytest, policy-yaml-roundtrip]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger agentic-sec coherence run
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ECOSYSTEM_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          repository: babywyrm/agentic-sec
          event-type: ecosystem-changed
          client-payload: '{"source": "mcpnuke", "sha": "${{ github.sha }}"}'
        continue-on-error: true
