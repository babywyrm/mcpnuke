name: Bug report
description: The scanner itself is broken — crash, error, or wrong behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Redact credentials, tokens, and internal
        hostnames** before pasting any output — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what mcpnuke did instead.
      placeholder: Expected a JSON report; got a traceback in transport detection.
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: The exact invocation (redact tokens and hosts as needed).
      placeholder: mcpnuke --targets http://localhost:9001 --json report.json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcpnuke version
      description: Output of `mcpnuke --version`.
      placeholder: 6.17.0
    validations:
      required: true

  - type: textarea
    id: target-context
    attributes:
      label: Target context
      description: |
        Transport (SSE / streamable HTTP / stdio / tool server), auth in play,
        rough tool count. No live hostnames or credentials.
      placeholder: Streamable HTTP, bearer auth, ~12 tools.

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Relevant output, redacted.
      render: shell
