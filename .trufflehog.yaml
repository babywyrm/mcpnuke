# TruffleHog v3 configuration for mcpnuke
# mcpnuke is a security scanner. Its test fixtures deliberately contain
# fake credentials so the scanner can verify it detects them.
# All flagged strings in tests/ and test_targets/ are intentional.

exclude_paths:
  - 1/        # Python venv — third-party library examples

exclude_detectors:
  - Polygon   # botocore geo data — not a Polygon API key
  - Pastebin  # pytest RECORD checksums — not Pastebin tokens
  - URI       # library test examples — not real credentials

# Intentional fake credential files (suppress with path exclusion if needed):
#   tests/test_response_credentials.py        — scanner test fixture
#   tests/test_credential_in_schema.py        — scanner test fixture
#   tests/test_error_leakage_json.py          — scanner test fixture
#   tests/test_actuator_probe.py              — scanner test fixture
#   tests/test_targets/DVMCP/challenges/      — CTF challenge servers
#   tests/test_targets/DVMCP/solutions/       — CTF walkthrough docs
#   camazotz-nuc-*.json                       — scan result artifacts
