[project]
name = "mcpnuke"
version = "6.15.0"
description = "MCP red teaming & security scanner — enumerate, probe, and exploit Model Context Protocol servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "babywyrm" },
]
keywords = ["mcp", "security", "red-team", "pentest", "scanner", "model-context-protocol", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
k8s = [
    "kubernetes>=31.0",
]
ai = [
    "anthropic>=0.40",
    "boto3>=1.35",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]
all = [
    "mcpnuke[ai,k8s,server]",
]

[project.scripts]
mcpnuke = "mcpnuke.__main__:main"
# Via a shim, not mcpnuke.server.app:run directly. The runner needs the
# optional `server` extra but its script is installed by the base package,
# so the target must be importable without fastapi/pydantic present.
mcpnuke-runner = "mcpnuke._runner_entry:main"

[project.urls]
Homepage = "https://github.com/babywyrm/mcpnuke"
Repository = "https://github.com/babywyrm/mcpnuke"
Documentation = "https://github.com/babywyrm/mcpnuke/blob/main/docs/checks.md"
Changelog = "https://github.com/babywyrm/mcpnuke/blob/main/CHANGELOG.md"
Issues = "https://github.com/babywyrm/mcpnuke/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpnuke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --ignore=tests/test_targets"

# Coverage is configured but not switched on by default: --cov roughly doubles
# a full run, and the suite is already 80s. Opt in with
# `uv run pytest tests/ --cov=mcpnuke`.
[tool.coverage.run]
source = ["mcpnuke"]
branch = true

[tool.coverage.report]
show_missing = true
# No `omit`, deliberately. mcpnuke/server/* sits at 0% because it needs the
# optional `server` extra, and mcpnuke/scanner.py is low because most tests
# drive the pipeline directly. Both are real gaps; excluding them would raise
# the number without covering a line. There is no fail_under for the same
# reason MYPY_CEILING lives in CI rather than here — a floor that trips on a
# focused single-file run gets switched off.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Vendored lab servers, checked out as nested repos for live testing. They are
# deliberately bad code and not ours to fix, and linting them buries our own
# findings: a checked-out DVMCP contributes ~500 errors to a clean tree. CI only
# escapes this because it does not check the gitlinks out.
extend-exclude = ["tests/test_targets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# ScanDepth/ScanStatus cross the runner's HTTP API boundary. StrEnum and
# (str, Enum) differ in what str()/f-string interpolation produce, so this is
# not a safe mechanical rewrite; revisit with the server API contract in view.
"mcpnuke/server/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# core/ is fully annotated, so it holds the stricter line: a new function here
# must declare its types. The checks/ layer is not there yet — 74 untyped defs
# at last count — and gets the same treatment once that is cleared.
[[tool.mypy.overrides]]
module = ["mcpnuke.core.*"]
disallow_untyped_defs = true

# Optional extras (ai, k8s, server). These are imported lazily inside
# functions and are absent from the base install and from CI, so mypy cannot
# resolve them. pyyaml is a core dependency and gets real stubs instead, via
# types-PyYAML in the dev extra.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "boto3.*",
    "botocore.*",
    "fastapi.*",
    "kubernetes.*",
    "pydantic.*",
    "uvicorn.*",
]
ignore_missing_imports = true
